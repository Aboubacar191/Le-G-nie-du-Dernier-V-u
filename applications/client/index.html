<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!--
      Content-Security-Policy stricte (ARCHI conventions.securite_operationnelle).
      Le jeton de session vit en localStorage : une XSS serait son seul vecteur
      d'exfiltration. 'unsafe-inline' sur style-src est le compromis de Vue pour
      les styles de composant ; aucun script inline n'est autorisé.
      En production, cet en-tête doit AUSSI être servi par le serveur : une
      balise meta ne couvre pas tout.

      ANO-12 — connect-src est passé de « 'self' wss: » à « 'self' ».
      Le schéma nu wss: autorisait l'émission vers TOUT hôte en WebSocket
      sécurisé : un script injecté ouvrait wss://hote-de-l-attaquant/ et y
      versait le jeton de session. Le reste de la politique était pourtant
      soigné — object-src 'none', base-uri 'none', form-action 'none',
      script-src 'self' — ce qui rendait cette ouverture d'autant plus saillante.

      Pourquoi 'self' SUFFIT, et ne casse pas le développement en HTTP sur
      réseau local : le canal temps réel est construit à partir de
      location.host, jamais d'un hôte reçu du serveur. Voir
      src/magasin/session.ts / origineParDefaut() — le serveur ne transmet
      qu'un CHEMIN (url_temps_reel), l'origine est toujours celle du document.
      La socket est donc same-origin par construction, en ws:// derrière le
      proxy de développement comme en wss:// en production, et CSP niveau 3
      fait correspondre 'self' aux variantes ws et wss de l'origine du
      document. L'hôte de déploiement n'a donc même pas à être injecté à la
      construction, ce qui retire une variable de plus.

      CE QUI N'EST PAS CORRIGÉ ICI, et qui est consigné au
      RAPPORT-FRONTEND-002 :
        · le jeton en localStorage. Le déplacer vers un cookie Secure,
          HttpOnly, SameSite=Strict est une mesure de défense en profondeur qui
          change le contrat d'authentification du canal temps réel : la
          décision appartient au tech-lead (ANO-12 / co_assigne), pas à moi ;
        · 'unsafe-inline' sur style-src, imposé par les styles de composant Vue ;
        · cette balise meta ne couvre ni frame-ancestors ni le document d'erreur
          du serveur : l'en-tête HTTP reste nécessaire côté serveur.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; connect-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <meta name="referrer" content="no-referrer" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icones/icone-192.png" />

    <!--
      Polices embarquées : Cinzel (titres, voix du génie) et DM Sans (interface),
      SIL Open Font License 1.1. Notices et licences dans
      /polices/POLICES-LICENCES.txt, distribué AVEC les woff2 comme l'OFL l'exige.
      Les deux sous-ensembles « latin » sont préchargés parce qu'ils servent sur
      tous les écrans ; « latin-ext » ne se charge que si un pseudonyme ou un
      libellé en sort. Les CHIFFRES ne sont jamais préchargés : ils sont composés
      sur la pile système, donc hors du chemin de chargement des polices.
    -->
    <link
      rel="preload"
      href="/polices/cinzel-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/polices/dm-sans-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />

    <!--
      ESC-01 TRANCHÉE — univers Zafyr. Les deux valeurs sont des copies
      littérales de tokens.couleur.theme_*.surface-fond : l'attribut content
      d'une balise meta n'accepte ni var() ni jeton, c'est une contrainte de la
      spécification HTML et non une préférence. La requête de média permet au
      moins que la couleur de l'interface du navigateur suive le thème, comme le
      fait jetons.css dès le premier rendu.
    -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#F4EEDF" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0B0A18" />
    <title>Le Génie du Dernier Vœu</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
