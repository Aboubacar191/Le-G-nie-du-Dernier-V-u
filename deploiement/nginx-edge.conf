server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # REST (ADR-TL-23) : transmis sans réécriture, comme en développement.
    location /api/ {
        proxy_pass http://gdv-serveur:8443/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Canal temps réel WebSocket (serveur-ws.ts : CHEMIN_CANAL = '/tr').
    location /tr {
        proxy_pass http://gdv-serveur:8443/tr;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 3600s;
    }

    # PWA : route Vue (history mode), fallback sur index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
