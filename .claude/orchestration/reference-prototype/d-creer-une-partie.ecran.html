<script type="text/x-dc" data-dc-script="" data-props="{&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:844}}">
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { rounds: 5, talk: 120 };
  }
  renderVals() {
    const seg = (on) => ({
      border: on ? '#E6B95A' : '#3A3463',
      bg: on ? '#E6B95A' : '#221E3D',
      fg: on ? '#15122A' : '#F4EEDF',
      pressed: on ? 'true' : 'false'
    });
    const rounds = [3, 5, 7].map((n) => Object.assign({ label: String(n), pick: () => this.setState({ rounds: n }) }, seg(this.state.rounds === n)));
    const talks = [[90, '1:30'], [120, '2:00'], [180, '3:00']].map((t) => Object.assign({ label: t[1], pick: () => this.setState({ talk: t[0] }) }, seg(this.state.talk === t[0])));
    const minutes = Math.round(this.state.rounds * (this.state.talk + 200) / 60);
    return { rounds: rounds, talks: talks, minutes: minutes };
  }
}
</script>
