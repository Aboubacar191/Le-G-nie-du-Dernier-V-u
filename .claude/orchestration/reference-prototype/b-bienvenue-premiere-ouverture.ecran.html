<style>
body{margin:0}
a{color:#E6B95A}a:hover{color:#F4D28A}
input::placeholder{color:#8F88AE}
input:focus{outline:2px solid #E6B95A;outline-offset:2px}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #15122A; color: #F4EEDF; font-family: 'DM Sans', system-ui, sans-serif; display: flex; flex-direction: column; padding: 40px 24px 28px; gap: 24px">
  <div style="display: flex; flex-direction: column; gap: 8px">
    <span style="font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: #B9B2D6">Première ouverture</span>
    <h1 style="margin: 0; font-family: 'Cinzel', serif; font-size: 28px; font-weight: 700; line-height: 1.2; color: #E6B95A">Bienvenue à Zafyr, marchand</h1>
    <p style="margin: 0; font-size: 15px; line-height: 1.5; color: #D9D3EE">Choisis le nom sous lequel le génie t'appellera. Pas de compte, pas de mot de passe.</p>
  </div>
  <div style="display: flex; justify-content: center; padding: 8px 0">
    <div role="img" aria-label="Aperçu de ton avatar" style="width: 112px; height: 112px; border-radius: 999px; background: {{color}}; display: grid; place-items: center; font-family: 'Cinzel', serif; font-size: 44px; font-weight: 700; color: #15122A">{{initial}}</div>
  </div>
  <div style="display: flex; flex-direction: column; gap: 8px">
    <label for="pseudo" style="font-size: 14px; font-weight: 700">Ton pseudo</label>
    <input id="pseudo" type="text" maxlength="14" value="{{name}}" sc-camel-on-change="{{setName}}" placeholder="Ex. Aboubacar" style="min-height: 52px; box-sizing: border-box; padding: 0 16px; border-radius: 14px; border: 1px solid #3A3463; background: #221E3D; color: #F4EEDF; font: 500 16px 'DM Sans', sans-serif">
    <span style="font-size: 12px; color: #B9B2D6">14 caractères maximum. Tu pourras le changer plus tard.</span>
  </div>
  <div style="display: flex; flex-direction: column; gap: 10px">
    <span style="font-size: 14px; font-weight: 700">Ta couleur à la table</span>
    <div style="display: flex; gap: 12px; flex-wrap: wrap">
      <sc-for list="{{swatches}}" as="s" hint-placeholder-count="6">
        <button aria-label="{{s.label}}" sc-camel-on-click="{{s.pick}}" style="width: 44px; height: 44px; border-radius: 999px; background: {{s.hex}}; border: 3px solid {{s.ring}}; cursor: pointer"></button>
      </sc-for>
    </div>
  </div>
  <div style="flex-grow: 1"></div>
  <a href="Accueil.dc.html" style="display: flex; align-items: center; justify-content: center; min-height: 56px; border-radius: 16px; background: #E6B95A; color: #15122A; font-weight: 700; font-size: 16px; text-decoration: none">Entrer dans la cité</a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script="" data-props="{&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:844}}">
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { name: 'Aboubacar', picked: 0 };
  }
  renderVals() {
    const palette = [
      { hex: '#E6B95A', label: 'Or' },
      { hex: '#7FD6C4', label: 'Turquoise' },
      { hex: '#E89A6B', label: 'Cuivre' },
      { hex: '#B8A6F2', label: 'Lavande' },
      { hex: '#F0A090', label: 'Corail' },
      { hex: '#A8D67F', label: 'Menthe' }
    ];
    const name = this.state.name;
    return {
      name: name,
      initial: name.trim() ? name.trim().charAt(0).toUpperCase() : '?',
      color: palette[this.state.picked].hex,
      setName: (e) => this.setState({ name: e.target.value }),
      swatches: palette.map((p, i) => ({
        hex: p.hex,
        label: 'Couleur ' + p.label,
        ring: i === this.state.picked ? '#F4EEDF' : '#15122A',
        pick: () => this.setState({ picked: i })
      }))
    };
  }
}
</script>
